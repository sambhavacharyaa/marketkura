{% extends 'base.html' %}{% block content %}<h1>Verification review</h1><form class="search"><input name="q" value="{{ query }}" placeholder="Search applicant"><select name="status"><option value="pending">Pending</option><option value="approved">Approved</option><option value="rejected">Rejected</option></select><button class="btn">Filter</button></form>{% for application in applications %}<article class="post-card"><h2><a href="{% url 'review_verification' application.pk %}">{{ application.user.username }}</a></h2><p>{{ application.full_name }} · {{ application.get_status_display }}</p></article>{% empty %}<div class="panel">No applications found.</div>{% endfor %}{% endblock %}
