{% load i18n %}<form id="comment-vote-{{ comment.pk }}" class="vote-group vote-group-sm" method="post" action="{% url 'toggle_comment_vote' comment.pk %}" hx-post="{% url 'toggle_comment_vote' comment.pk %}" hx-target="#comment-vote-{{ comment.pk }}" hx-swap="outerHTML">{% csrf_token %}
  <button class="vote-arrow{% if comment.user_vote_direction == 'up' %} voted{% endif %}" type="submit" name="direction" value="up" aria-pressed="{% if comment.user_vote_direction == 'up' %}true{% else %}false{% endif %}" aria-label="{% if comment.user_vote_direction == 'up' %}{% trans 'Remove upvote' %}{% else %}{% trans 'Upvote' %}{% endif %}">{% include 'partials/icon.html' with name='up' cls='icon-solid vote-glyph' %}</button>
  <span class="vote-count num">{{ comment.upvotes }}</span>
  <button class="vote-arrow down{% if comment.user_vote_direction == 'down' %} voted{% endif %}" type="submit" name="direction" value="down" aria-pressed="{% if comment.user_vote_direction == 'down' %}true{% else %}false{% endif %}" aria-label="{% if comment.user_vote_direction == 'down' %}{% trans 'Remove downvote' %}{% else %}{% trans 'Downvote' %}{% endif %}">{% include 'partials/icon.html' with name='down' cls='icon-solid vote-glyph' %}</button>
</form>
