{% load i18n %}<form id="comment-vote-{{ comment.pk }}" class="inline" method="post" action="{% url 'toggle_comment_vote' comment.pk %}" hx-post="{% url 'toggle_comment_vote' comment.pk %}" hx-target="#comment-vote-{{ comment.pk }}" hx-swap="outerHTML">{% csrf_token %}<button class="vote-btn{% if comment.user_voted %} voted{% endif %}" type="submit" aria-pressed="{{ comment.user_voted|yesno:'true,false' }}">{% if comment.user_voted %}{% include 'partials/icon.html' with name='up-solid' cls='icon-solid vote-glyph' %}{% else %}{% include 'partials/icon.html' with name='up' cls='vote-glyph' %}{% endif %} {{ comment.upvotes }}</button></form>
