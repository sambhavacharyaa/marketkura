{% load i18n community_extras %}{% if page.has_other_pages %}<nav class="pagination" aria-label="{% trans 'Pagination' %}">
  {% if page.has_previous %}<a href="?{% query_string page=page.previous_page_number %}">{% trans "Previous" %}</a>{% endif %}
  <span>{% blocktrans with n=page.number total=page.paginator.num_pages %}Page {{ n }} of {{ total }}{% endblocktrans %}</span>
  {% if page.has_next %}<a href="?{% query_string page=page.next_page_number %}">{% trans "Next" %}</a>{% endif %}
</nav>{% endif %}
