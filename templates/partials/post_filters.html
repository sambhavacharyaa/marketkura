{% load i18n %}<details class="panel"{% if request.GET.type or request.GET.asset or request.GET.verified or request.GET.position or request.GET.horizon or request.GET.date or request.GET.sort %} open{% endif %}>
  <summary>{% trans "More filters" %}</summary>
  <form method="get" style="margin-top:12px">
    {% if request.GET.q %}<input type="hidden" name="q" value="{{ request.GET.q }}">{% endif %}{% if request.GET.tab %}<input type="hidden" name="tab" value="{{ request.GET.tab }}">{% endif %}{% if request.GET.category %}<input type="hidden" name="category" value="{{ request.GET.category }}">{% endif %}
    <div class="filters">
      <div><label for="f-type">{% trans "Type" %}</label><select id="f-type" name="type"><option value="">{% trans "All" %}</option><option value="discussion"{% if request.GET.type == 'discussion' %} selected{% endif %}>{% trans "Discussion" %}</option><option value="thesis"{% if request.GET.type == 'thesis' %} selected{% endif %}>{% trans "Thesis" %}</option><option value="ama"{% if request.GET.type == 'ama' %} selected{% endif %}>{% trans "AMA" %}</option></select></div>
      <div><label for="f-asset">{% trans "Asset" %}</label><select id="f-asset" name="asset"><option value="">{% trans "All" %}</option>{% for asset in assets %}<option value="{{ asset.slug }}"{% if request.GET.asset == asset.slug or request.GET.asset|upper == asset.ticker %} selected{% endif %}>{{ asset.ticker|default:asset.name }}</option>{% endfor %}</select></div>
      <div><label for="f-position">{% trans "Position" %}</label><select id="f-position" name="position"><option value="">{% trans "All" %}</option><option value="long"{% if request.GET.position == 'long' %} selected{% endif %}>{% trans "Long" %}</option><option value="short"{% if request.GET.position == 'short' %} selected{% endif %}>{% trans "Short" %}</option><option value="watching"{% if request.GET.position == 'watching' %} selected{% endif %}>{% trans "Watching" %}</option></select></div>
      <div><label for="f-horizon">{% trans "Horizon" %}</label><select id="f-horizon" name="horizon"><option value="">{% trans "All" %}</option><option value="short"{% if request.GET.horizon == 'short' %} selected{% endif %}>{% trans "Short term" %}</option><option value="medium"{% if request.GET.horizon == 'medium' %} selected{% endif %}>{% trans "Medium term" %}</option><option value="long"{% if request.GET.horizon == 'long' %} selected{% endif %}>{% trans "Long term" %}</option></select></div>
      <div><label for="f-date">{% trans "Date" %}</label><select id="f-date" name="date"><option value="">{% trans "Any time" %}</option><option value="week"{% if request.GET.date == 'week' %} selected{% endif %}>{% trans "Past week" %}</option></select></div>
      <div><label for="f-sort">{% trans "Sort" %}</label><select id="f-sort" name="sort"><option value="">{% trans "Latest" %}</option><option value="discussed"{% if request.GET.sort == 'discussed' %} selected{% endif %}>{% trans "Most discussed" %}</option></select></div>
      <div><label><input type="checkbox" name="verified" value="1"{% if request.GET.verified == '1' %} checked{% endif %}> {% trans "Verified members only" %}</label></div>
      <div><button class="btn" type="submit">{% trans "Apply" %}</button></div>
    </div>
  </form>
</details>
