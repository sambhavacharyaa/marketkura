{% load i18n %}<form id="post-vote" class="vote-group" method="post" action="{% url 'toggle_post_vote' post.pk %}" hx-post="{% url 'toggle_post_vote' post.pk %}" hx-target="#post-vote" hx-swap="outerHTML">{% csrf_token %}<input type="hidden" name="next" value="{{ post.get_absolute_url }}">
  <button class="vote-arrow{% if post.user_vote_direction == 'up' %} voted{% endif %}" type="submit" name="direction" value="up" aria-pressed="{% if post.user_vote_direction == 'up' %}true{% else %}false{% endif %}" aria-label="{% if post.user_vote_direction == 'up' %}{% trans 'Remove upvote' %}{% else %}{% trans 'Upvote' %}{% endif %}">{% include 'partials/icon.html' with name='up' cls='icon-solid vote-glyph' %}</button>
  <span class="vote-count num">{{ post.upvotes }}</span>
  <button class="vote-arrow down{% if post.user_vote_direction == 'down' %} voted{% endif %}" type="submit" name="direction" value="down" aria-pressed="{% if post.user_vote_direction == 'down' %}true{% else %}false{% endif %}" aria-label="{% if post.user_vote_direction == 'down' %}{% trans 'Remove downvote' %}{% else %}{% trans 'Downvote' %}{% endif %}">{% include 'partials/icon.html' with name='down' cls='icon-solid vote-glyph' %}</button>
</form>
