{% load i18n %}<form id="post-vote" method="post" action="{% url 'toggle_post_vote' post.pk %}" hx-post="{% url 'toggle_post_vote' post.pk %}" hx-target="#post-vote" hx-swap="outerHTML">{% csrf_token %}<input type="hidden" name="next" value="{{ post.get_absolute_url }}"><button class="vote-btn{% if user_voted %} voted{% endif %}" type="submit" aria-pressed="{{ user_voted|yesno:'true,false' }}">{% if user_voted %}{% include 'partials/icon.html' with name='up-solid' cls='icon-solid vote-glyph' %}{% else %}{% include 'partials/icon.html' with name='up' cls='vote-glyph' %}{% endif %} {% if user_voted %}{% trans "Upvoted" %}{% else %}{% trans "Upvote" %}{% endif %} · {{ post.upvotes }}</button></form>
