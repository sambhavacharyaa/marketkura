<!DOCTYPE html>
{% load i18n static %}
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "Something went wrong" %} | MarketKuraa</title>
    <link rel="icon" href="{% static 'img/favicon.ico' %}" sizes="any">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
  </head>
  <body class="auth-body">
    <header class="auth-header">
      <a class="brand" href="/" aria-label="MarketKuraa"><img class="brand-logo" src="{% static 'img/logo.png' %}" alt="MarketKuraa" width="1564" height="238"></a>
    </header>
    <main class="auth-main">
      <section class="auth-card error-panel">
        <p class="error-code">500</p>
        <h1>{% trans "Something went wrong" %}</h1>
        <p class="muted">{% trans "We hit an unexpected error on our end. It has been logged, and we're on it. Please try again in a moment." %}</p>
        <div class="actions"><a class="btn" href="/">{% trans "Back to home" %}</a></div>
      </section>
    </main>
  </body>
</html>
