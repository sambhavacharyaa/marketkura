{% extends 'base.html' %}

{% block title %}{{ post.title }} — MarketKura{% endblock %}

{% block content %}
  <article class="panel">
    <span class="badge">{{ post.category.name }}</span>
    <span class="badge">{{ post.get_type_display }}</span>
    <h1>{{ post.title }}</h1>
    <div class="meta">Posted by {{ post.user.username }} · {{ post.created_at|date:'M d, Y' }}</div>
    <p>{{ post.body }}</p>
  </article>
{% endblock %}
