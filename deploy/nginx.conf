# /etc/nginx/sites-available/marketkuraa.com  (TLS certificates via certbot or your Bisup setup)
server {
    listen 80;
    server_name marketkuraa.com www.marketkuraa.com;
    return 301 https://marketkuraa.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name marketkuraa.com;
    ssl_certificate     /etc/letsencrypt/live/marketkuraa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marketkuraa.com/privkey.pem;

    client_max_body_size 6m;   # avatar uploads

    location /static/ { alias /srv/marketkura/staticfiles/; expires 30d; }
    location /media/  { alias /srv/marketkura/media/; expires 7d; }

    location / {
        proxy_pass http://unix:/run/marketkura/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
